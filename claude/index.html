<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>最後の花 · The Last Blossom — a sumi-e samurai short</title>
<style>
  html,body{margin:0;height:100%;background:#0c0b0a;overflow:hidden;color:#efe8d8;
    font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    box-shadow:0 0 120px rgba(0,0,0,.9);background:#ece4d3;overflow:hidden}
  #film{width:100%;height:100%;display:block}
  #controls{position:absolute;left:0;right:0;bottom:0;padding:18px 22px 16px;display:flex;gap:14px;align-items:center;
    background:linear-gradient(transparent,rgba(12,10,8,.72));opacity:0;transition:opacity .45s;user-select:none}
  #frame:hover #controls,#controls.show{opacity:1}
  #controls button{background:none;border:1px solid rgba(239,232,216,.55);color:#efe8d8;font:inherit;font-size:14px;
    padding:6px 14px;border-radius:2px;cursor:pointer;letter-spacing:.08em;min-width:44px}
  #controls button:hover{background:rgba(239,232,216,.14)}
  #bar{flex:1;height:6px;background:rgba(239,232,216,.22);cursor:pointer;position:relative;border-radius:3px}
  #fill{position:absolute;left:0;top:0;bottom:0;background:#b5291f;width:0;border-radius:3px}
  #time{font-size:13px;min-width:92px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.05em}
  #hint{position:absolute;top:16px;right:20px;font-size:13px;color:#2b2724;opacity:.0;transition:opacity .8s;
    pointer-events:none;letter-spacing:.1em}
  #hint.on{opacity:.75}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="film" width="1920" height="1080" aria-label="The Last Blossom — animated sumi-e film"></canvas>
    <div id="hint">♪ click anywhere for sound</div>
    <div id="controls">
      <button id="play" title="Play / Pause (Space)">❚❚ Pause</button>
      <button id="replay" title="Replay (R)">↺ Replay</button>
      <div id="bar"><div id="fill"></div></div>
      <div id="time">0:00 / 0:58</div>
      <button id="snd" title="Sound (M)">♪ On</button>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/figures.js"></script>
<script src="js/fx.js"></script>
<script src="js/scenes1.js"></script>
<script src="js/scenes2.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
